name: Android

on:
    push:
        branches: [main]
        paths:
            - "app/**"
            - "core/**"
            - "Cargo.toml"
            - "Cargo.lock"
            - "rust-toolchain.toml"
            - ".fvmrc"
            - ".github/workflows/android.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    apk:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "21"

            - uses: gradle/actions/setup-gradle@v6

            - run: rustup toolchain install

            - name: Install the pinned NDK
              run: |
                  ndk=$(grep -Po 'ndkVersion = "\K[^"]+' app/android/app/build.gradle.kts)
                  "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk"

            - name: Read the pinned Flutter version
              id: versions
              run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

            - uses: subosito/flutter-action@v2
              with:
                  flutter-version: ${{ steps.versions.outputs.flutter }}
                  channel: stable
                  cache: true

            - name: Build debug APK
              working-directory: app
              run: flutter build apk --debug

            - uses: actions/upload-artifact@v4
              with:
                  name: kronoer-debug-apk
                  path: app/build/app/outputs/flutter-apk/app-debug.apk
                  retention-days: 14
