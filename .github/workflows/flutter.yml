name: Flutter

on:
    pull_request:
        paths:
            - "app/**"
            - "core/**"
            - "Cargo.toml"
            - "Cargo.lock"
            - "rust-toolchain.toml"
            - ".fvmrc"
            - ".github/workflows/flutter.yml"
    push:
        branches: [main]
        paths:
            - "app/**"
            - "core/**"
            - "Cargo.toml"
            - "Cargo.lock"
            - "rust-toolchain.toml"
            - ".fvmrc"
            - ".github/workflows/flutter.yml"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - run: rustup toolchain install
            - uses: Swatinem/rust-cache@v2

            - name: Read pinned versions
              id: versions
              run: |
                  echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
                  echo "frb=$(grep -Po 'flutter_rust_bridge = "=\K[^"]+' app/rust/Cargo.toml)" >> "$GITHUB_OUTPUT"

            - uses: subosito/flutter-action@v2
              with:
                  flutter-version: ${{ steps.versions.outputs.flutter }}
                  channel: stable
                  cache: true

            - name: Install flutter_rust_bridge_codegen
              run: cargo install flutter_rust_bridge_codegen --version ${{ steps.versions.outputs.frb }} --locked

            - name: Get packages
              working-directory: app
              run: flutter pub get

            - name: Generated bindings are up to date
              working-directory: app
              run: |
                  flutter_rust_bridge_codegen generate
                  git status --porcelain
                  test -z "$(git status --porcelain)"

            - name: Build the bridge for the host
              run: cargo build -p kronoer_bridge

            - name: Format
              working-directory: app
              run: dart format --output=none --set-exit-if-changed lib test

            - name: Analyze
              working-directory: app
              run: flutter analyze

            - name: Test
              working-directory: app
              run: flutter test
