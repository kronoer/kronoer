[package]
name = "kronoer-core"
version = "0.1.0"
description = "Cryptography and the entry/Book format for Kronoer."
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
minicbor = { version = "2.3.1", features = ["std"] }
sha2 = "0.11.1"
zeroize = "1.9.2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dev-dependencies]
serde_json = "1.0.154"
